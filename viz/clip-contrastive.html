<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>CLIP contrastive</title>
<link rel="stylesheet" href="lib/viz.css">
<style>.row{display:flex;gap:10px;align-items:center}.lab{white-space:nowrap;flex:none}.seg{display:flex;gap:6px;flex-wrap:wrap}.seg button.on{border-color:var(--accent);color:var(--accent);font-weight:600}.seg button{padding:2px 9px}</style>
</head>
<body><div id="app">
  <div class="seg" id="mode"><button data-v="train" class="on">학습: 대조 손실</button><button data-v="zs">zero-shot 분류</button></div>
  <div class="caption" id="cap"></div>
  <svg class="stage" id="plot" viewBox="0 0 480 250" preserveAspectRatio="xMidYMid meet"></svg>
  <label class="row"><span class="lab">학습 진행(정렬) <b id="av"></b></span><input type="range" id="a" min="0" max="1" step="0.02" value="0.3"></label>
  <label class="row"><span class="lab">temperature τ <b id="tv"></b></span><input type="range" id="t" min="-2" max="0" step="0.05" value="-1.15"></label>
  <div class="seg" id="pick" style="display:none"></div>
</div>
<script id="logic">
  // 이미지·캡션 6쌍을 16차원 단위벡터로. 정렬 a가 커질수록 짝끼리 같은 개념 벡터로 모임
  const N = 6, D = 16;
  const IMG = ["🐶", "🐱", "🚗", "🍕", "🌳", "🎸"], TXT = ["dog", "cat", "car", "pizza", "tree", "guitar"];
  function rng(seed) { return () => { seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
  const unit = v => { const n = Math.hypot(...v); return v.map(x => x / n); };
  const R = rng(11), G = () => Math.sqrt(-2 * Math.log(R() + 1e-12)) * Math.cos(2 * Math.PI * R());
  const CON = Array.from({ length: N }, () => unit(Array.from({ length: D }, G)));
  const RI = Array.from({ length: N }, () => unit(Array.from({ length: D }, G)));
  const RT = Array.from({ length: N }, () => unit(Array.from({ length: D }, G)));
  function embed(a) {
    return { img: CON.map((c, i) => unit(c.map((x, k) => a * x + (1 - a) * RI[i][k]))), txt: CON.map((c, i) => unit(c.map((x, k) => a * x + (1 - a) * RT[i][k]))) };
  }
  function sims(E) { return E.img.map(u => E.txt.map(v => u.reduce((s, x, k) => s + x * v[k], 0))); }   // cosine
  const softmax = z => { const m = Math.max(...z), e = z.map(x => Math.exp(x - m)), s = e.reduce((a, b) => a + b, 0); return e.map(x => x / s); };
  function clipLoss(S, tau) {                 // 행(이미지→캡션)과 열(캡션→이미지) cross-entropy의 평균
    let l = 0;
    for (let i = 0; i < N; i++) l -= Math.log(softmax(S[i].map(x => x / tau))[i]);
    for (let j = 0; j < N; j++) l -= Math.log(softmax(S.map(r => r[j] / tau))[j]);
    return l / (2 * N);
  }
  function zeroShot(E, i, tau) { return softmax(sims(E)[i].map(x => x / tau)); }
</script>
<script>
  const I = id => document.getElementById(id), svg = I("plot");
  let mode = "train", pickI = 0;
  I("pick").innerHTML = IMG.map((e, i) => `<button data-i="${i}" class="${i ? "" : "on"}">${e}</button>`).join("");
  function draw() {
    const a = +I("a").value, tau = 10 ** +I("t").value, E = embed(a), S = sims(E);
    I("av").textContent = Math.round(a * 100) + "%"; I("tv").textContent = tau.toFixed(3);
    let s = "";
    if (mode === "train") {
      const c = 34, x0 = 40, y0 = 28;
      TXT.forEach((t, j) => s += `<text x="${x0 + j * c + c / 2}" y="${y0 - 8}" font-size="11" text-anchor="middle" fill="var(--muted)">${t}</text>`);
      S.forEach((row, i) => {
        s += `<text x="${x0 - 8}" y="${y0 + i * c + c / 2 + 6}" font-size="18" text-anchor="end">${IMG[i]}</text>`;
        row.forEach((v, j) => {
          const op = Math.max(0, Math.min(1, (v + 0.3) / 1.3));
          s += `<rect x="${x0 + j * c}" y="${y0 + i * c}" width="${c - 2}" height="${c - 2}" rx="3" fill="${i === j ? "var(--good)" : "var(--accent)"}" opacity="${(0.08 + 0.92 * op).toFixed(2)}"/><text x="${x0 + j * c + c / 2 - 1}" y="${y0 + i * c + c / 2 + 4}" font-size="10" text-anchor="middle" fill="var(--fg)">${v.toFixed(2)}</text>`;
        });
      });
      const L = clipLoss(S, tau), diag = S.map((r, i) => softmax(r.map(x => x / tau))[i]), avg = diag.reduce((p, q) => p + q, 0) / N;
      s += `<text x="256" y="50" font-size="14" font-weight="600" fill="var(--fg)">CLIP loss = ${L.toFixed(3)}</text>
        <text x="256" y="70" font-size="12" fill="var(--muted)">무작위면 log 6 = ${Math.log(N).toFixed(3)}</text>
        <text x="256" y="104" font-size="14" font-weight="600" fill="var(--good)">짝을 맞힐 확률 평균 ${(avg * 100).toFixed(0)}%</text>
        <text x="256" y="124" font-size="12" fill="var(--muted)">행마다 softmax(유사도/τ)의 대각선</text>
        <text x="256" y="164" font-size="12" fill="var(--good)">초록 = 진짜 짝(끌어당김)</text><text x="256" y="184" font-size="12" fill="var(--accent)">파랑 = 다른 짝(밀어냄)</text>`;
      I("cap").innerHTML = a < 0.4
        ? `배치의 N개 쌍으로 N×N 유사도 행렬을 만들고, 대각선(진짜 짝)은 높이고 나머지는 낮추도록 행·열 방향 cross-entropy를 줌. 아직 정렬이 덜 돼 loss가 높음 — τ가 작으면 무작위 수준(log N)보다도 큼`
        : `정렬될수록 대각선이 밝아지고 loss가 떨어짐. τ를 줄이면 같은 유사도 차이도 확률 차이로 크게 벌어짐(CLIP은 τ도 학습). 배치가 클수록 밀어낼 음성이 많아져 표현이 좋아짐`;
    } else {
      const p = zeroShot(E, pickI, tau), best = p.indexOf(Math.max(...p));
      s += `<text x="45" y="110" font-size="50" text-anchor="middle">${IMG[pickI]}</text><text x="45" y="145" font-size="12" text-anchor="middle" fill="var(--muted)">입력 이미지</text>`;
      p.forEach((v, j) => {
        const y = 22 + j * 36;
        s += `<text x="232" y="${y + 18}" font-size="12" text-anchor="end" fill="var(--fg)">"a photo of a ${TXT[j]}"</text><rect x="240" y="${y + 4}" width="${Math.max(2, v * 195)}" height="20" rx="3" fill="${j === best ? "var(--good)" : "var(--accent)"}" opacity="${j === best ? 1 : 0.5}"/><text x="${Math.min(446, 244 + v * 195)}" y="${y + 19}" font-size="12" fill="var(--fg)">${(v * 100).toFixed(0)}%</text>`;
      });
      I("cap").innerHTML = `zero-shot: 클래스 이름을 "a photo of a {class}" 문장으로 만들어 텍스트 인코더에 넣고, 이미지 임베딩과 cosine이 가장 큰 문장을 고름 — 그 클래스로 학습한 적이 없어도 분류됨. 정렬이 덜 된 모델이면 틀리기도 함`;
    }
    svg.innerHTML = s;
  }
  I("mode").addEventListener("click", e => {
    const b = e.target.closest("button"); if (!b) return;
    mode = b.dataset.v; [...I("mode").children].forEach(x => x.classList.toggle("on", x === b));
    I("pick").style.display = mode === "zs" ? "flex" : "none"; draw();
  });
  I("pick").addEventListener("click", e => {
    const b = e.target.closest("button"); if (!b) return;
    pickI = +b.dataset.i; [...I("pick").children].forEach(x => x.classList.toggle("on", x === b)); draw();
  });
  ["a", "t"].forEach(id => I(id).addEventListener("input", draw));
  if (location.hash === "#zs") { I("a").value = 0.7; I("mode").children[1].click(); } else draw();
</script>
</body>
</html>
