<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>ViT patches</title>
<link rel="stylesheet" href="lib/viz.css">
<style>.row{display:flex;gap:10px;align-items:center}.lab{white-space:nowrap;flex:none;min-width:4.5em;color:var(--muted)}.seg{display:flex;gap:6px;flex-wrap:wrap}.seg button{padding:2px 10px}.seg button.on{border-color:var(--accent);color:var(--accent);font-weight:600}</style>
</head>
<body><div id="app">
  <div class="caption" id="cap"></div>
  <svg class="stage" id="plot" viewBox="0 0 520 240" preserveAspectRatio="xMidYMid meet"></svg>
  <div class="row"><span class="lab">해상도</span><div class="seg" id="res"><button data-v="224" class="on">224</button><button data-v="336">336</button><button data-v="448">448</button><button data-v="896">896</button></div></div>
  <div class="row"><span class="lab">patch</span><div class="seg" id="patch"><button data-v="14">14</button><button data-v="16" class="on">16</button><button data-v="32">32</button></div></div>
  <div class="row"><span class="lab">VLM 병합</span><div class="seg" id="merge"><button data-v="1" class="on">없음</button><button data-v="2">2×2 → 1</button></div></div>
</div>
<script id="logic">
  function tokens(res, patch, merge) { const side = res / patch / merge; return Math.round(side * side); }
  function attnCost(res, patch) { const n = tokens(res, patch, 1); return n * n; }   // attention 점수 행렬 크기
</script>
<script>
  const I = id => document.getElementById(id), svg = I("plot");
  const st = { res: 224, patch: 16, merge: 1 };
  function draw() {
    const { res, patch, merge } = st, side = res / patch, n = tokens(res, patch, 1), nv = tokens(res, patch, merge);
    const S = 200, x0 = 20, y0 = 20, cell = S / side;
    let s = `<defs><linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#5b8def"/><stop offset="1" stop-color="#f7c873"/></linearGradient></defs>
      <rect x="${x0}" y="${y0}" width="${S}" height="${S}" fill="url(#sky)"/>
      <circle cx="${x0 + 140}" cy="${y0 + 60}" r="24" fill="#ffe08a"/>
      <polygon points="${x0},${y0 + S} ${x0 + 70},${y0 + 90} ${x0 + 130},${y0 + S}" fill="#4b6b4f"/><polygon points="${x0 + 90},${y0 + S} ${x0 + 160},${y0 + 110} ${x0 + S},${y0 + 170} ${x0 + S},${y0 + S}" fill="#36513a"/>`;
    for (let k = 1; k < side; k++) s += `<line x1="${x0 + k * cell}" y1="${y0}" x2="${x0 + k * cell}" y2="${y0 + S}" stroke="#fff" stroke-width="${side > 40 ? 0.4 : 0.8}" opacity=".8"/><line x1="${x0}" y1="${y0 + k * cell}" x2="${x0 + S}" y2="${y0 + k * cell}" stroke="#fff" stroke-width="${side > 40 ? 0.4 : 0.8}" opacity=".8"/>`;
    if (merge > 1) for (let k = 2; k < side; k += 2) s += `<line x1="${x0 + k * cell}" y1="${y0}" x2="${x0 + k * cell}" y2="${y0 + S}" stroke="var(--bad)" stroke-width="1.2"/><line x1="${x0}" y1="${y0 + k * cell}" x2="${x0 + S}" y2="${y0 + k * cell}" stroke="var(--bad)" stroke-width="1.2"/>`;
    s += `<text x="${x0 + S / 2}" y="${y0 + S + 16}" font-size="12" text-anchor="middle" fill="var(--muted)">${res}×${res} · patch ${patch}×${patch} · 한 변 ${side}칸</text>`;
    // 오른쪽: 토큰 줄
    const show = Math.min(n, 10);
    for (let k = 0; k < show; k++) s += `<rect x="${250 + k * 16}" y="40" width="13" height="13" rx="2" fill="var(--accent)" opacity="${0.4 + 0.6 * ((k * 37) % 10) / 10}"/>`;
    s += `<text x="${250 + show * 16 + 4}" y="51" font-size="12" fill="var(--muted)">… 총 ${n.toLocaleString()}개</text>`;
    const ratio = attnCost(res, patch) / attnCost(224, 16);
    const rows = [
      ["patch 하나 = 숫자", `${patch}×${patch}×3 = ${(patch * patch * 3).toLocaleString()}개 → 선형층으로 d차원 토큰`],
      ["이미지 토큰 수", `(${res}/${patch})² = ${n.toLocaleString()}개 (+ 분류용 [CLS])`],
      ["attention 점수 행렬", `${n.toLocaleString()}² ≈ ${(attnCost(res, patch) / 1e6).toFixed(2)}M — 224/16의 ${ratio < 10 ? ratio.toFixed(1) : Math.round(ratio)}배`],
      ["LLM에 넣는 시각 토큰", `${nv.toLocaleString()}개${merge > 1 ? " (2×2 병합으로 ¼)" : ""} · 8K 문맥의 ${(nv / 8192 * 100).toFixed(0)}%`],
    ];
    rows.forEach(([k, v], i) => s += `<text x="250" y="${92 + i * 36}" font-size="12" fill="var(--muted)">${k}</text><text x="250" y="${110 + i * 36}" font-size="14" font-weight="600" fill="${i === 3 ? (nv > 2000 ? "var(--bad)" : "var(--good)") : "var(--fg)"}">${v}</text>`);
    svg.innerHTML = s;
    I("cap").innerHTML = `ViT: 이미지를 ${patch}×${patch} patch로 잘라 펼친 뒤 선형층으로 토큰을 만들고 <b>위치 임베딩</b>을 더해 Transformer에 넣음. 해상도를 2배로 올리면 토큰 4배, attention 16배 — 고해상도 VLM이 토큰을 병합·압축하는 이유`;
  }
  for (const id of ["res", "patch", "merge"]) I(id).addEventListener("click", e => {
    const b = e.target.closest("button"); if (!b) return;
    st[id] = +b.dataset.v; [...I(id).children].forEach(x => x.classList.toggle("on", x === b)); draw();
  });
  const h = location.hash.match(/^#(\d+)-(\d+)-(\d)$/);
  if (h) [["res", h[1]], ["patch", h[2]], ["merge", h[3]]].forEach(([id, v]) => [...I(id).children].find(b => b.dataset.v === v)?.click());
  draw();
</script>
</body>
</html>
