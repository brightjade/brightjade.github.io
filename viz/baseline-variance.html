<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Baseline variance</title>
<link rel="stylesheet" href="lib/viz.css">
<style>.row{display:flex;gap:12px;align-items:center}.seg{display:flex;gap:6px;flex-wrap:wrap}.seg button.on{border-color:var(--accent);color:var(--accent);font-weight:600}</style>
</head>
<body><div id="app">
  <div class="caption" id="cap"></div>
  <svg class="stage" id="plot" viewBox="0 0 700 270" preserveAspectRatio="xMidYMid meet"></svg>
  <label class="row"><span style="white-space:nowrap">모든 보상에 <b id="cv"></b> 더하기</span><input type="range" id="shift" min="0" max="20" step="1" value="10"></label>
  <div style="color:var(--muted);font-size:12px">행동 3개(보상 1·2·3 + 잡음), 균등한 정책. 한 번 샘플로 낸 REINFORCE gradient(행동 1의 logit 방향) 2,000개의 분포.</div>
</div>
<script id="logic">
  const REWARDS = [1, 2, 3], P = 1 / 3;
  function rng(seed) { let s = seed >>> 0; return () => { s = (Math.imul(s, 1664525) + 1013904223) >>> 0; return s / 4294967296; }; }
  // 단일 샘플 추정치: (1[a=0] − π0) · (R − b)
  function estimates(shift, useBaseline, n, seed) {
    const r = rng(seed), out = [];
    const b = useBaseline ? 2 + shift : 0;               // baseline = 평균 보상
    for (let i = 0; i < n; i++) {
      const a = Math.floor(r() * 3), R = REWARDS[a] + shift + (r() - 0.5);
      out.push(((a === 0 ? 1 : 0) - P) * (R - b));
    }
    return out;
  }
  function stats(xs) {
    const mean = xs.reduce((a, b) => a + b, 0) / xs.length;
    return { mean, variance: xs.reduce((a, b) => a + (b - mean) ** 2, 0) / xs.length };
  }
</script>
<script>
  const svg = document.getElementById("plot"), slider = document.getElementById("shift");
  const LO = -10, HI = 10, BINS = 40, X = v => 60 + (Math.max(LO, Math.min(HI, v)) - LO) / (HI - LO) * 600;
  function hist(xs, y0, color, label) {
    const counts = Array(BINS).fill(0);
    xs.forEach(v => counts[Math.min(BINS - 1, Math.max(0, Math.floor((v - LO) / (HI - LO) * BINS)))]++);
    const max = Math.max(...counts), w = 600 / BINS, s = stats(xs);
    return counts.map((c, i) => `<rect x="${60 + i * w}" y="${y0 + 100 - c / max * 78}" width="${w - 1}" height="${c / max * 78}" fill="${color}" opacity=".75"/>`).join("") +
      `<line x1="${X(s.mean)}" y1="${y0 + 20}" x2="${X(s.mean)}" y2="${y0 + 102}" stroke="var(--fg)" stroke-width="2"/>` +
      `<text x="60" y="${y0 + 12}" font-size="12" fill="${color}">${label} — 평균 ${s.mean.toFixed(2)}, 분산 ${s.variance.toFixed(1)}</text>`;
  }
  function draw() {
    const c = +slider.value;
    document.getElementById("cv").textContent = c;
    const a = estimates(c, false, 2000, 3), b = estimates(c, true, 2000, 3);
    svg.innerHTML = hist(a, 0, "var(--bad)", "baseline 없음") + hist(b, 122, "var(--good)", "baseline = 평균 보상") +
      `<line x1="${X(-1 / 3)}" y1="18" x2="${X(-1 / 3)}" y2="226" stroke="var(--accent)" stroke-dasharray="4 4"/>` +
      `<text x="${X(-1 / 3) + 4}" y="242" font-size="11" fill="var(--accent)">참 gradient −0.33</text>` +
      `<text x="60" y="265" font-size="11" fill="var(--muted)">−10</text><text x="660" y="265" text-anchor="end" font-size="11" fill="var(--muted)">+10</text>`;
    document.getElementById("cap").innerHTML = c === 0
      ? "보상이 작을 땐 둘 다 비슷함. 슬라이더로 모든 보상에 같은 값을 더해 볼 것"
      : `보상에 ${c}를 더해도 <b>평균(기댓값)은 그대로</b>지만, baseline이 없으면 분산이 <b style="color:var(--bad)">폭발</b>함 — 빼 주면 "평균보다 나았나"만 남음`;
  }
  slider.addEventListener("input", draw);
  draw();
</script>
</body>
</html>
