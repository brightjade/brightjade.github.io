</div>

{

  {
   "id": "train",
   "label": "학습"

  {

   "label": "평가 · 출시"
  }
 ],
 "nodes": [
  {
   "id": "prompts",
   "label": "프롬프트 수집",

   "lane": "data",
   "col": 0
  },
  {
   "id": "sample",
   "label": "응답 샘플링",
   "kind": "model",
   "lane": "data",

    "prompts"
   ]
  },
  {
   "cap": "현재 모델로 <b>응답 샘플링</b> — 같은 프롬프트에 여러 답",
   "show": [
    "sample"
   ]
  },
  {
   "cap": "<b>선호 라벨</b>: 사람 또는 AI(원칙·루브릭)가 둘 중 나은 답을 고름. 라벨러 일치도도 잼",

    "label"

  },
  {

    "rm",
    "verifier"
   ]

  {
   "cap": "<b>RL</b>(PPO·GRPO)로 보상을 올리되 참조 모델과의 <b>KL</b>로 멀리 못 가게 묶음. 새 샘플로 다시 돎 (C1)",

    "rl"
   ]
  },
  {

    "evals",
    "ship"
   ]
  },
  {
   "cap": "<b>실패 경로</b>: 보상 점수만 보고 체크포인트를 고르면 보상 해킹된 모델이 나감 → 따로 둔 평가와 KL·길이 감시",
   "show": []
  }
 ]
}
