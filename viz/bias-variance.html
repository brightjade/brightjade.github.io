<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Bias and variance</title>
<link rel="stylesheet" href="lib/viz.css">
<style>.row{display:flex;gap:10px;align-items:center}.lab{white-space:nowrap;flex:none}.seg{display:flex;gap:6px;flex-wrap:wrap}.seg button.on{border-color:var(--accent);color:var(--accent);font-weight:600}</style>
</head>
<body><div id="app">
  <div class="caption" id="cap"></div>
  <svg class="stage" id="plot" viewBox="0 0 700 230" preserveAspectRatio="xMidYMid meet"></svg>
  <label class="row"><span class="lab">다항식 차수 <b id="dv"></b></span><input type="range" id="d" min="1" max="12" step="1" value="3"></label>
  <label class="row"><span class="lab">학습 데이터 <b id="nv"></b>개</span><input type="range" id="n" min="10" max="60" step="1" value="15"></label>
  <div class="seg"><button id="many">다른 데이터셋 10개로 다시 맞추기</button></div>
</div>
<script id="logic">
  // 진짜 함수 sin(πx)에 노이즈(σ = 0.3)를 섞은 데이터를 다항식으로 맞춤
  function rng(seed) { return () => { seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
  const truth = x => Math.sin(Math.PI * x), NOISE = 0.3, GRID = Array.from({ length: 101 }, (_, i) => -1 + i / 50);
  function sample(n, seed) {
    const r = rng(seed), g = () => Math.sqrt(-2 * Math.log(r() + 1e-12)) * Math.cos(2 * Math.PI * r());
    return Array.from({ length: n }, () => { const x = 2 * r() - 1; return [x, truth(x) + NOISE * g()]; });
  }
  function fit(pts, d) {                      // 최소제곱 (정규방정식 + 아주 작은 ridge)
    const n = d + 1, A = Array.from({ length: n }, () => new Array(n + 1).fill(0));
    for (const [x, y] of pts) { const p = Array.from({ length: n }, (_, i) => x ** i); for (let i = 0; i < n; i++) { for (let j = 0; j < n; j++) A[i][j] += p[i] * p[j]; A[i][n] += p[i] * y; } }
    for (let i = 0; i < n; i++) A[i][i] += 1e-9;
    for (let c = 0; c < n; c++) {
      let piv = c; for (let r = c + 1; r < n; r++) if (Math.abs(A[r][c]) > Math.abs(A[piv][c])) piv = r;
      [A[c], A[piv]] = [A[piv], A[c]];
      for (let r = 0; r < n; r++) if (r !== c) { const f = A[r][c] / A[c][c]; for (let k = c; k <= n; k++) A[r][k] -= f * A[c][k]; }
    }
    return A.map((row, i) => row[n] / row[i]);
  }
  const evalp = (w, x) => w.reduce((s, c, i) => s + c * x ** i, 0);
  function experiment(d, n, seed) {
    const pts = sample(n, seed), w = fit(pts, d);
    const mse = data => data.reduce((s, [x, y]) => s + (evalp(w, x) - y) ** 2, 0) / data.length;
    const fits = Array.from({ length: 20 }, (_, k) => fit(sample(n, 100 + k), d));
    const spread = GRID.reduce((s, x) => { const v = fits.map(f => evalp(f, x)), m = v.reduce((a, b) => a + b) / v.length; return s + v.reduce((a, b) => a + (b - m) ** 2, 0) / v.length; }, 0) / GRID.length;
    return { train: mse(pts), test: mse(sample(400, 999)), spread, w, pts, fits };
  }
</script>
<script>
  const I = id => document.getElementById(id), svg = I("plot");
  let many = false;
  const X = x => 20 + (x + 1) / 2 * 380, Y = y => 115 - y * 70;
  const clipY = y => Math.max(8, Math.min(222, Y(y)));
  const line = w => GRID.map((x, i) => `${i ? "L" : "M"}${X(x).toFixed(1)},${clipY(evalp(w, x)).toFixed(1)}`).join("");
  function draw() {
    const d = +I("d").value, n = +I("n").value, r = experiment(d, n, 7);
    I("dv").textContent = d; I("nv").textContent = n;
    let s = `<rect x="20" y="8" width="380" height="214" fill="none" stroke="var(--line)"/>`;
    s += `<path d="${GRID.map((x, i) => `${i ? "L" : "M"}${X(x)},${Y(truth(x))}`).join("")}" fill="none" stroke="var(--good)" stroke-width="2" stroke-dasharray="5 4"/>`;
    if (many) r.fits.slice(0, 10).forEach(w => s += `<path d="${line(w)}" fill="none" stroke="var(--accent)" stroke-width="1.2" opacity=".35"/>`);
    s += `<path d="${line(r.w)}" fill="none" stroke="var(--accent)" stroke-width="3"/>`;
    r.pts.forEach(([x, y]) => s += `<circle cx="${X(x)}" cy="${clipY(y)}" r="3.5" fill="var(--fg)"/>`);
    s += `<text x="26" y="24" font-size="12" fill="var(--good)">진짜 함수</text><text x="26" y="40" font-size="12" fill="var(--accent)">차수 ${d} 다항식</text>`;
    // 오른쪽: 차수별 train/test 오차 (로그 눈금)
    const all = Array.from({ length: 12 }, (_, i) => experiment(i + 1, n, 7));
    const EX = k => 450 + (k - 1) / 11 * 230, EY = v => 200 - (Math.log10(Math.max(v, 0.01)) + 2) / 3 * 180;
    s += `<line x1="450" x2="680" y1="200" y2="200" stroke="var(--line)"/><text x="450" y="18" font-size="12" fill="var(--muted)">오차 (로그 눈금)</text><text x="680" y="218" font-size="12" text-anchor="end" fill="var(--muted)">차수 1 → 12</text>`;
    s += `<polyline points="${all.map((e, i) => `${EX(i + 1)},${EY(e.train)}`).join(" ")}" fill="none" stroke="var(--muted)" stroke-width="2"/>`;
    s += `<polyline points="${all.map((e, i) => `${EX(i + 1)},${Math.max(10, EY(e.test))}`).join(" ")}" fill="none" stroke="var(--bad)" stroke-width="2.5"/>`;
    s += `<text x="${EX(12)}" y="${Math.min(196, EY(all[11].train) + 14)}" font-size="12" text-anchor="end" fill="var(--muted)">train</text><text x="${EX(1) + 4}" y="${Math.max(24, EY(all[0].test) - 6)}" font-size="12" fill="var(--bad)">test</text>`;
    s += `<line x1="${EX(d)}" x2="${EX(d)}" y1="10" y2="200" stroke="var(--accent)" stroke-dasharray="3 3"/><circle cx="${EX(d)}" cy="${Math.max(10, EY(r.test))}" r="5" fill="var(--bad)"/>`;
    svg.innerHTML = s;
    const best = all.reduce((b, e, i) => e.test < all[b].test ? i : b, 0) + 1;
    I("cap").innerHTML = d < best - 1
      ? `<b>underfit (bias)</b>: 곡선이 너무 단순해 train·test 모두 오차가 큼. 데이터를 바꿔도 비슷하게 틀림`
      : d > best + 2
        ? `<b style="color:var(--bad)">overfit (variance)</b>: train 오차는 ${r.train.toFixed(3)}로 작은데 test는 ${r.test.toFixed(3)} — 노이즈까지 외움. "다시 맞추기"로 데이터셋마다 곡선이 얼마나 달라지는지 볼 것`
        : `적당한 복잡도: test 오차가 가장 낮은 근처(차수 ${best}). 데이터를 늘리면 높은 차수도 덜 흔들림 — variance는 데이터로 줄일 수 있음`;
  }
  ["d", "n"].forEach(id => I(id).addEventListener("input", draw));
  I("many").addEventListener("click", e => { many = !many; e.target.classList.toggle("on", many); draw(); });
  if (location.hash === "#many") I("many").click(); else draw();
</script>
</body>
</html>
