<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="strict-origin-when-cross-origin">
<meta name="robots" content="noindex">
<title>YouTube</title>
<!--
  yt.html?v=<11-char id>[&t=90 | 90s | 1m30s]
  Wraps a YouTube embed in an https page so the player request carries a Referer.
  Apps that render embeds in a WebView (Notion mobile) send none, and YouTube then
  refuses with error 153 ("Video player configuration error").
-->
<style>
  html, body { margin: 0; height: 100%; background: #000; }
  iframe { display: block; width: 100%; height: 100%; border: 0; }
  a { color: #fff; font: 16px/1.4 system-ui, sans-serif; display: block; padding: 16px; }
</style>
</head>
<body>
<script>
  const params = new URLSearchParams(location.search);
  const id = params.get("v") || "";

  function seconds(t) {
    if (/^\d+s?$/.test(t)) return parseInt(t, 10);
    const m = /^(?:(\d+)h)?(?:(\d+)m)?(?:(\d+)s)?$/.exec(t);
    return m ? (+m[1] || 0) * 3600 + (+m[2] || 0) * 60 + (+m[3] || 0) : 0;
  }

  if (/^[A-Za-z0-9_-]{11}$/.test(id)) {
    const query = new URLSearchParams({ rel: "0", playsinline: "1" });
    const start = seconds(params.get("t") || "");
    if (start > 0) query.set("start", start);
    const frame = document.createElement("iframe");
    frame.src = `https://www.youtube.com/embed/${id}?${query}`;
    frame.title = "YouTube video player";
    frame.allow = "accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share; fullscreen";
    frame.allowFullscreen = true;
    frame.referrerPolicy = "strict-origin-when-cross-origin";
    document.body.append(frame);
  } else {
    document.body.innerHTML = '<a href="https://www.youtube.com/">Missing or invalid video id</a>';
  }
</script>
</body>
</html>
